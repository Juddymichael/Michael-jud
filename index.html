<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Thunder Edge — Journal de Trading &amp; Edge Analyzer</title>
    <meta name="description" content="Journal de trading haute précision, calculateur d'edge statistique et graphiques institutionnels." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0E14" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ThunderEdge" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Android / General Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ThunderEdge" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <!-- Web Fonts: Geist (UI) + JetBrains Mono (Financial) + Inter (Fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph & Twitter -->
    <meta property="og:title" content="Thunder Edge — Journal de Trading &amp; Edge Analyzer" />
    <meta property="og:description" content="Journal de trading haute précision, calculateur d'edge statistique et graphiques institutionnels." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#F7F8FA] dark:bg-[#0A0E14] text-[#1A1D23] dark:text-[#E6E8EB] antialiased select-none sm:select-auto overflow-x-hidden touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
